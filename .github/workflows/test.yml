name: test

permissions:
  contents: read

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 낡은 툴체인(bash 3.2 + 시스템 python3)은 아래 별도 단계가 macOS 러너에서 검사한다.
        # 애플이 GPLv3 때문에 bash 3.2를 계속 싣기 때문에 macos-latest로 충분하다.
        # macos-13을 따로 두었다가 뺐다. 큐에서 안 돌아 커버리지처럼 보이기만 했다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: 문법 검사
        run: |
          bash -n hooks/*/*.sh skills/unit.sh
          python3 -m py_compile hooks/no-guess-gate/judge.py
      - name: shellcheck
        if: runner.os != 'Windows'
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck || brew install shellcheck
          fi
          shellcheck --version
          shellcheck -x -s bash hooks/*/*.sh skills/unit.sh

      - name: 결정적 단위 테스트 (모델 호출 없음)
        run: |
          hooks/lib/unit.sh
          hooks/no-guess-gate/unit.sh
          hooks/done-gate/unit.sh
          hooks/test-integrity/unit.sh
          hooks/project-guard/unit.sh
          hooks/repo-profile/unit.sh
          skills/unit.sh

      - name: (임시) 판정기 진단 — Windows
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          echo "bash=$(command -v bash)  python3=$(command -v python3)"
          python3 -c "import os,shutil,sys;print('os.name',os.name);print('which bash',shutil.which('bash'));print('stdout enc',sys.stdout.encoding)"
          J=$(mktemp -d)
          printf '#!/usr/bin/env bash\ncat >/dev/null; echo '\''{"release": true, "why": "ok"}'\''\n' > "$J/ok.sh"
          chmod +x "$J/ok.sh"
          echo "--- 가짜 판정기 직접 실행"
          bash "$J/ok.sh" </dev/null; echo "직접 exit=$?"
          echo "--- judge.py 통과"
          printf '%s' '{"prompt":"p","rules":"R2b","tools":"0","bash":"0","last":"x","flagged":"y"}' \
            | NGG_JUDGE_CMD="$J/ok.sh" python3 hooks/no-guess-gate/judge.py; echo "judge exit=$?"
          echo "--- 셔뱅 실행"
          printf '%s' '{"prompt":"p","rules":"R2b","tools":"0","bash":"0","last":"x","flagged":"y"}' \
            | NGG_JUDGE_CMD="$J/ok.sh" hooks/no-guess-gate/judge.py; echo "셔뱅 exit=$?"

      - name: 공격면 점검 (SECURITY.md 가 적은 것과 코드가 맞는지)
        run: hooks/attack-surface.sh

      - name: 견고성 퍼징 (모델 호출 없음)
        run: hooks/fuzz.sh

      - name: 낡은 툴체인 (bash 3.2 + 시스템 python3, macOS만)
        if: runner.os == 'macOS'
        run: |
          SH=$(mktemp -d)
          ln -s /bin/bash "$SH/bash"
          ln -s /usr/bin/python3 "$SH/python3"
          "$SH/bash" --version | head -1
          "$SH/python3" -V
          for f in hooks/*/unit.sh skills/unit.sh; do
            PATH="$SH:$PATH" "$f"
          done
