name: release

# 태그를 밀면 검사를 다 돌리고 릴리스를 만든다.
# 손으로 하면 plugin.json 버전과 태그가 어긋나기 쉽다. 실제로 1.1.0 을 낼 때 손으로 올렸다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 태그와 plugin.json 버전이 같은지
        run: |
          tag="${GITHUB_REF_NAME#v}"
          man=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          echo "태그 $tag · 매니페스트 $man"
          [ "$tag" = "$man" ] || { echo "::error::태그와 .claude-plugin/plugin.json 의 version 이 다르다"; exit 1; }

      - name: CHANGELOG 에 이 버전이 있는지
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md 에 [$tag] 항목이 없다"; exit 1; }

      - name: 전체 검사
        run: |
          for g in lib no-guess-gate done-gate test-integrity project-guard repo-profile; do
            hooks/$g/unit.sh
          done
          skills/unit.sh
          hooks/attack-surface.sh
          hooks/fuzz.sh

      - name: 릴리스 노트를 CHANGELOG 에서 뽑는다
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python3 - "$tag" > notes.md <<'PY'
          import io, re, sys
          tag = sys.argv[1]
          s = io.open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r'^## \[' + re.escape(tag) + r'\].*?$(.*?)(?=^## \[|\Z)', s, re.M | re.S)
          io.open(sys.stdout.fileno(), "w", encoding="utf-8").write((m.group(1).strip() if m else "") + "\n")
          PY
          wc -l notes.md

      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "이미 있는 릴리스다. 노트만 덮어쓰지 않고 그대로 둔다."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" -F notes.md
          fi
